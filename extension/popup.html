<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root { color-scheme: dark; }
      body {
        width: 300px;
        margin: 0;
        padding: 14px;
        font: 13px/1.5 -apple-system, "Segoe UI", sans-serif;
        background: #0b1220;
        color: #dbe8ff;
      }
      h1 { font-size: 15px; margin: 0 0 4px; }
      p.sub { margin: 0 0 12px; color: #8fa6c9; font-size: 12px; }
      label { display: block; font-weight: 700; margin: 0 0 4px; }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid #2b3b57;
        background: #0a1526;
        color: #cfe3ff;
        font-family: monospace;
        font-size: 12px;
      }
      .row { display: flex; gap: 8px; margin-top: 10px; }
      button {
        flex: 1;
        padding: 9px 10px;
        border-radius: 6px;
        border: 1px solid #2b3b57;
        background: linear-gradient(135deg, #1fb6ff, #0a7bd6);
        color: #04121f;
        font-weight: 800;
        cursor: pointer;
      }
      button.ghost { background: #11203a; color: #cfe3ff; }
      .status { margin-top: 10px; font-size: 12px; color: #9fd0a6; min-height: 16px; }
      a { color: #5bd0ff; }
      ol { margin: 10px 0 0; padding-left: 18px; color: #8fa6c9; font-size: 12px; }
      li { margin-bottom: 2px; }
    </style>
  </head>
  <body>
    <h1>전적몬 ↔ Aegis 연동</h1>
    <p class="sub">Aegis 매치를 전적몬에 자동 기록합니다.</p>

    <label for="token">연동 토큰</label>
    <input id="token" type="text" placeholder="jjm_..." autocomplete="off" spellcheck="false" />
    <div class="row">
      <button id="save">저장</button>
      <button id="open" class="ghost">전적몬에서 토큰 받기</button>
    </div>
    <div class="status" id="status"></div>

    <ol>
      <li><b>전적몬에서 토큰 받기</b> → Google 로그인 → "Aegis 연동" → 토큰 발급·복사</li>
      <li>위 칸에 붙여넣고 <b>저장</b></li>
      <li>Aegis에 로그인한 채로 두면 끝 (자동 기록)</li>
    </ol>

    <script src="popup.js"></script>
  </body>
</html>
